# SY Note Sync CI
# 校验范围（按约定）：Go 编译 + 单元测试、插件 JS/TS 语法校验
# 不做：容器构建、端到端测试（由 NAS 真实环境验证承担）
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # 支持手动触发

jobs:
  # ---------- 后端：Go 编译 + 单元测试 ----------
  go-backend:
    name: Go 编译与单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: server/go.sum

      - name: 下载依赖
        run: go mod download

      - name: 编译检查
        run: go build ./...

      - name: go vet 静态检查
        run: go vet ./...

      - name: 运行单元测试
        run: go test -v ./...

  # ---------- 插件：构建 + 语法校验 ----------
  plugin-check:
    name: 插件语法校验
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 pnpm 9
        # 固定 pnpm 大版本：pnpm v10 默认开启 minimumReleaseAge 供应链策略，
        # 会误拒 lockfile 中的新包，导致 frozen-lockfile 安装失败
        run: npm install -g pnpm@9

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: TypeScript 类型与语法校验
        # tsc --noEmit：只做类型/语法检查，不产出文件
        run: pnpm exec tsc --noEmit

      - name: 构建验证
        # vite 构建包含完整语法校验，构建通过即代表产物可生成
        run: pnpm build
